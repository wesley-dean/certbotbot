# Milestone 16 / ADR-046: prebuilt immutable upstream server images only.
# The manifest is intentionally Docker/linux-amd64 specific until verified elsewhere.
# No host ports, no external network, and no host state/credential mounts.
services:
  pebble:
    # Challenges bypassed only for local lifecycle integration, per ADR-047.
    image: ghcr.io/letsencrypt/pebble:sha-b1e1ca4@sha256:5080492187bea12909c053d7a2b90a9e95104ef1c82381828e7823db71ce7e54
    platform: linux/amd64
    command: ["-config", "/opt/local-e2e-pebble.json", "-strict"]
    volumes:
      - ./pebble-config.json:/opt/local-e2e-pebble.json:ro
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_VA_ALWAYS_VALID: "1"
    networks:
      isolated:
        ipv4_address: 172.31.248.2
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  acme-gateway:
    # Prebuilt Caddy v2.10.2 linux/amd64, immutable image manifest.
    # Source: official Docker Hub library/caddy image for 2.10.2.
    image: docker.io/library/caddy:2.10.2@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
    platform: linux/amd64
    user: "10001:10001"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      - pebble
    volumes:
      - ./gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pebble-upstream.pem:/etc/caddy/pebble-upstream.pem:ro
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    tmpfs:
      - /data:size=67108864,mode=0700,uid=10001,gid=10001
      - /config:size=16777216,mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # Only the binding of canonical HTTPS port 443 is authorized.
      - NET_BIND_SERVICE
    networks:
      isolated:
        ipv4_address: 172.31.248.5
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  route53-bridge:
    # Synthetic, no-DNS Route53 API stub on a pinned stdlib Python runtime.
    # The upstream image digest still requires independent registry verification.
    image: docker.io/library/python:3.13.18-slim-trixie@sha256:aaf08c5490d52cd92bc27142a5215b1e47355a5eaf9adfad2a0fbc022d0b5490
    platform: linux/amd64
    user: "65534:65534"
    command: ["python3", "-I", "-B", "/opt/route53/route53_bridge.py"]
    environment:
      # Explicit local-only fixture. Never source a real AWS zone from the host.
      LOCAL_E2E_ROUTE53_HOSTED_ZONE_ID: "ZLOCALONLY123456"
    volumes:
      - ./route53_bridge.py:/opt/route53/route53_bridge.py:ro
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=0700,uid=65534,gid=65534
    cap_drop:
      - ALL
    networks:
      isolated:
        ipv4_address: 172.31.248.6
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  seaweedfs:
    # Official published version; digest obtained from an external
    # Docker Hub RepoDigests inventory, not independently pulled here.
    # The bootstrap verifies image availability, not real S3 compatibility.
    image: docker.io/chrislusf/seaweedfs:4.01@sha256:d91cdf769018b143f1c944085b36d29893d9af199e656b2537367c35744fc221
    platform: linux/amd64
    command: ["server", "-s3", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    tmpfs:
      - /data:size=536870912
    networks:
      isolated:
        ipv4_address: 172.31.248.4
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

networks:
  isolated:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.248.0/24
