---
name: "Test issue metadata synchronization"
# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - "scripts/update_issue_parent_child_relationships.bash"
      - "scripts/update_issue_project_status.bash"
      - "scripts/update_issue_dependencies.bash"
      - "tests/issue-metadata-sync.bash"
      - "scripts/update_issue_dependencies.bash"
      - "tests/issue-dependencies-sync.bash"
      - "scripts/render_issue_kanban.bash"
      - "tests/issue-kanban-report.bash"
      - "scripts/publish_issue_kanban.bash"
      - "tests/issue-kanban-publisher.bash"
      - ".github/workflows/issue-metadata-sync.yml"
      - ".github/workflows/issue-metadata-sync-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/update_issue_parent_child_relationships.bash"
      - "scripts/update_issue_project_status.bash"
      - "scripts/update_issue_dependencies.bash"
      - "tests/issue-metadata-sync.bash"
      - "scripts/update_issue_dependencies.bash"
      - "tests/issue-dependencies-sync.bash"
      - "scripts/render_issue_kanban.bash"
      - "tests/issue-kanban-report.bash"
      - "scripts/publish_issue_kanban.bash"
      - "tests/issue-kanban-publisher.bash"

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false
      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n scripts/update_issue_parent_child_relationships.bash
          bash -n scripts/update_issue_project_status.bash
          bash -n tests/issue-metadata-sync.bash
          bash -n scripts/update_issue_dependencies.bash
          bash -n tests/issue-dependencies-sync.bash
          bash -n scripts/render_issue_kanban.bash
          bash -n tests/issue-kanban-report.bash
          bash -n scripts/publish_issue_kanban.bash
          bash -n tests/issue-kanban-publisher.bash
      - name: Run mocked metadata synchronization tests
        shell: bash
        run: |
          bash tests/issue-metadata-sync.bash
          bash tests/issue-dependencies-sync.bash
          bash tests/issue-kanban-report.bash
          bash tests/issue-kanban-publisher.bash
