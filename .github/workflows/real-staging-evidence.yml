---
name: Opt-in real ACME staging portability evidence

# Never run from push, pull_request, schedules, or a release.
# CKV_GHA_7 addresses parameterized reproducible *builds*.  This workflow
# builds no deployable product; its inputs are operator-reviewed DNS identity
# and an explicit false-by-default authorization for external staging calls.
# ADR-044 requires these per-dispatch controls plus main-only execution,
# protected acme-staging approval, fixed ACME URL, and scoped AWS credentials.
# checkov:skip=CKV_GHA_7: Manual staging evidence needs reviewed DNS inputs and explicit opt-in
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Owned, lower-case DNS-01 staging certificate base name
        type: string
        required: true
      extra_name:
        description: Owned additional DNS SAN strictly below domain
        type: string
        required: true
      aws_region:
        description: AWS region for scoped Route53 staging role
        type: string
        required: true
        default: us-east-1
      authorize:
        description: I authorize staging ACME requests and Route53 TXT changes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: certbotbot-real-staging-evidence
  cancel-in-progress: false

jobs:
  issue:
    if: github.ref == 'refs/heads/main' && inputs.authorize == true
    environment: acme-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    outputs:
      account_sha256: ${{ steps.phase.outputs.account_sha256 }}
      leaf_sha256: ${{ steps.phase.outputs.leaf_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes curl make openssl gnupg
      - name: Prepare real Certbot 5.8.0 with Route53 plugin
        run: |
          python3 -m venv "${RUNNER_TEMP}/certbot-venv"
          "${RUNNER_TEMP}/certbot-venv/bin/python" -m pip install \
            --disable-pip-version-check 'certbot==5.8.0' \
            'certbot-dns-route53==5.8.0'
          make all
      - name: Authenticate only to the allowed staging Route53 role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CERTBOTBOT_STAGING_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: certbotbot-staging-issue
      - name: Issue a genuine staging certificate and export encrypted state
        id: phase
        env:
          CERTBOTBOT_ARTIFACT: ${{ github.workspace }}/dist/certbotbot.bash
          CERTBOT: ${{ runner.temp }}/certbot-venv/bin/certbot
          CERTBOTBOT_STAGING_DOMAIN: ${{ inputs.domain }}
          CERTBOTBOT_STAGING_EXTRA_NAME: ${{ inputs.extra_name }}
          CERTBOTBOT_STAGING_EMAIL: ${{ vars.CERTBOTBOT_STAGING_EMAIL }}
          CERTBOTBOT_STAGING_CONFIRM: yes
          CERTBOTBOT_STAGING_PHASE: issue
          CERTBOTBOT_STAGING_CA_PEM: ${{ secrets.CERTBOTBOT_STAGING_CA_PEM }}
          CERTBOTBOT_STAGING_CA_BUNDLE: ${{ runner.temp }}/staging-ca.pem
          CERTBOTBOT_STAGING_OUTPUT_DIR: ${{ runner.temp }}/archive-export
          ACME_ENVIRONMENT: staging
          GPG_PASSPHRASE: ${{ secrets.CERTBOTBOT_STAGING_GPG_PASSPHRASE }}
        run: |
          umask 077
          mkdir -m 0700 "${CERTBOTBOT_STAGING_OUTPUT_DIR}"
          printf '%s\n' "${CERTBOTBOT_STAGING_CA_PEM}" \
            >"${CERTBOTBOT_STAGING_CA_BUNDLE}"
          bash tests/integration/live-staging-portability.bash issue
      - name: Export ciphertext only for the second independent runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-a-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-export/*.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  noop:
    needs: issue
    environment: acme-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      account_sha256: ${{ steps.phase.outputs.account_sha256 }}
      leaf_sha256: ${{ steps.phase.outputs.leaf_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install local tools and pinned Certbot
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl make openssl gnupg
          python3 -m venv "${RUNNER_TEMP}/certbot-venv"
          "${RUNNER_TEMP}/certbot-venv/bin/python" -m pip install \
            --disable-pip-version-check 'certbot==5.8.0' \
            'certbot-dns-route53==5.8.0'
          make all
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-a-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-input
      - name: Reconstruct account and confirm genuine no-op renewal
        id: phase
        env:
          CERTBOTBOT_ARTIFACT: ${{ github.workspace }}/dist/certbotbot.bash
          CERTBOT: ${{ runner.temp }}/certbot-venv/bin/certbot
          CERTBOTBOT_STAGING_DOMAIN: ${{ inputs.domain }}
          CERTBOTBOT_STAGING_EXTRA_NAME: ${{ inputs.extra_name }}
          CERTBOTBOT_STAGING_EMAIL: ${{ vars.CERTBOTBOT_STAGING_EMAIL }}
          CERTBOTBOT_STAGING_CONFIRM: yes
          CERTBOTBOT_STAGING_PHASE: noop
          CERTBOTBOT_STAGING_CA_PEM: ${{ secrets.CERTBOTBOT_STAGING_CA_PEM }}
          CERTBOTBOT_STAGING_CA_BUNDLE: ${{ runner.temp }}/staging-ca.pem
          CERTBOTBOT_STAGING_INPUT_DIR: ${{ runner.temp }}/archive-input
          CERTBOTBOT_STAGING_OUTPUT_DIR: ${{ runner.temp }}/archive-export
          CERTBOTBOT_EXPECTED_ACCOUNT_SHA256: ${{ needs.issue.outputs.account_sha256 }}
          CERTBOTBOT_EXPECTED_LEAF_SHA256: ${{ needs.issue.outputs.leaf_sha256 }}
          ACME_ENVIRONMENT: staging
          GPG_PASSPHRASE: ${{ secrets.CERTBOTBOT_STAGING_GPG_PASSPHRASE }}
        run: |
          umask 077
          mkdir -m 0700 "${CERTBOTBOT_STAGING_OUTPUT_DIR}"
          printf '%s\n' "${CERTBOTBOT_STAGING_CA_PEM}" \
            >"${CERTBOTBOT_STAGING_CA_BUNDLE}"
          bash tests/integration/live-staging-portability.bash noop
      - name: Export updated ARI-capable ciphertext
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-b-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-export/*.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  change-sans:
    needs: [issue, noop]
    environment: acme-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    outputs:
      account_sha256: ${{ steps.phase.outputs.account_sha256 }}
      leaf_sha256: ${{ steps.phase.outputs.leaf_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install local tools and pinned Route53 Certbot
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl make openssl gnupg
          python3 -m venv "${RUNNER_TEMP}/certbot-venv"
          "${RUNNER_TEMP}/certbot-venv/bin/python" -m pip install \
            --disable-pip-version-check 'certbot==5.8.0' \
            'certbot-dns-route53==5.8.0'
          make all
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-b-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-input
      - name: Authenticate to allowed staging Route53 role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CERTBOTBOT_STAGING_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: certbotbot-staging-change
      - name: Replace selected lineage SAN set under the same account
        id: phase
        env:
          CERTBOTBOT_ARTIFACT: ${{ github.workspace }}/dist/certbotbot.bash
          CERTBOT: ${{ runner.temp }}/certbot-venv/bin/certbot
          CERTBOTBOT_STAGING_DOMAIN: ${{ inputs.domain }}
          CERTBOTBOT_STAGING_EXTRA_NAME: ${{ inputs.extra_name }}
          CERTBOTBOT_STAGING_EMAIL: ${{ vars.CERTBOTBOT_STAGING_EMAIL }}
          CERTBOTBOT_STAGING_CONFIRM: yes
          CERTBOTBOT_STAGING_PHASE: change
          CERTBOTBOT_STAGING_CA_PEM: ${{ secrets.CERTBOTBOT_STAGING_CA_PEM }}
          CERTBOTBOT_STAGING_CA_BUNDLE: ${{ runner.temp }}/staging-ca.pem
          CERTBOTBOT_STAGING_INPUT_DIR: ${{ runner.temp }}/archive-input
          CERTBOTBOT_STAGING_OUTPUT_DIR: ${{ runner.temp }}/archive-export
          CERTBOTBOT_EXPECTED_ACCOUNT_SHA256: ${{ needs.issue.outputs.account_sha256 }}
          CERTBOTBOT_EXPECTED_LEAF_SHA256: ${{ needs.noop.outputs.leaf_sha256 }}
          ACME_ENVIRONMENT: staging
          GPG_PASSPHRASE: ${{ secrets.CERTBOTBOT_STAGING_GPG_PASSPHRASE }}
        run: |
          umask 077
          mkdir -m 0700 "${CERTBOTBOT_STAGING_OUTPUT_DIR}"
          printf '%s\n' "${CERTBOTBOT_STAGING_CA_PEM}" \
            >"${CERTBOTBOT_STAGING_CA_BUNDLE}"
          bash tests/integration/live-staging-portability.bash change
      - name: Export only encrypted changed-SAN state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-c-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-export/*.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify-restored:
    needs: [issue, change-sans]
    environment: acme-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install offline reconstruction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl make openssl gnupg
          python3 -m venv "${RUNNER_TEMP}/certbot-venv"
          "${RUNNER_TEMP}/certbot-venv/bin/python" -m pip install \
            --disable-pip-version-check 'certbot==5.8.0' \
            'certbot-dns-route53==5.8.0'
          make all
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-c-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-input
      - name: Confirm restored changed-SAN certificate and account identity
        env:
          CERTBOTBOT_ARTIFACT: ${{ github.workspace }}/dist/certbotbot.bash
          CERTBOT: ${{ runner.temp }}/certbot-venv/bin/certbot
          CERTBOTBOT_STAGING_DOMAIN: ${{ inputs.domain }}
          CERTBOTBOT_STAGING_EXTRA_NAME: ${{ inputs.extra_name }}
          CERTBOTBOT_STAGING_EMAIL: ${{ vars.CERTBOTBOT_STAGING_EMAIL }}
          CERTBOTBOT_STAGING_CONFIRM: yes
          CERTBOTBOT_STAGING_PHASE: verify
          CERTBOTBOT_STAGING_CA_PEM: ${{ secrets.CERTBOTBOT_STAGING_CA_PEM }}
          CERTBOTBOT_STAGING_CA_BUNDLE: ${{ runner.temp }}/staging-ca.pem
          CERTBOTBOT_STAGING_INPUT_DIR: ${{ runner.temp }}/archive-input
          CERTBOTBOT_EXPECTED_ACCOUNT_SHA256: ${{ needs.issue.outputs.account_sha256 }}
          ACME_ENVIRONMENT: staging
          GPG_PASSPHRASE: ${{ secrets.CERTBOTBOT_STAGING_GPG_PASSPHRASE }}
        run: |
          umask 077
          printf '%s\n' "${CERTBOTBOT_STAGING_CA_PEM}" \
            >"${CERTBOTBOT_STAGING_CA_BUNDLE}"
          bash tests/integration/live-staging-portability.bash verify
