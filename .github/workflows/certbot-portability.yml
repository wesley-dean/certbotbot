---
name: Certbot portable-state smoke tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certbot-smoke:
    name: Real Certbot portable no-op renewal
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl make openssl python3-venv

      - name: Prepare isolated pinned Certbot
        run: |
          python3 -m venv "${RUNNER_TEMP}/certbot-venv"
          "${RUNNER_TEMP}/certbot-venv/bin/python" -m pip install \
            --disable-pip-version-check 'certbot==5.8.0'
          "${RUNNER_TEMP}/certbot-venv/bin/certbot" --version

      - name: Build the standalone artifacts
        run: make all

      - name: Inspect relocated lineage and confirm no-op renewal
        env:
          CERTBOT: ${{ runner.temp }}/certbot-venv/bin/certbot
        run: |
          for artifact in dist/certbotbot.dev.bash \
                          dist/certbotbot.bash \
                          dist/certbotbot.min.bash; do
            CERTBOTBOT_ARTIFACT="${GITHUB_WORKSPACE}/${artifact}" \
              bash tests/integration/certbot-readonly-portability.bash
          done
