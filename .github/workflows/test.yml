---
name: Test

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check, build, and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl doxygen graphviz make shellcheck shfmt

      - name: Verify build does not acquire missing dependencies
        run: |
          test ! -e vendor
          stderr="${RUNNER_TEMP}/build.stderr"
          if make build >/dev/null 2>"${stderr}"; then
            printf '%s\n' 'make build unexpectedly succeeded without prepared dependencies' >&2
            exit 1
          fi
          grep -F 'Missing prepared mktext library; run make deps' "${stderr}"
          test ! -e vendor

      - name: Verify documentation does not acquire missing adrctl
        run: |
          mkdir -p vendor
          printf '%s\n' '# prepared documentation filter' >vendor/doxygen-bash.awk
          stderr="${RUNNER_TEMP}/docs.stderr"
          if make docs >/dev/null 2>"${stderr}"; then
            printf '%s\n' 'make docs unexpectedly succeeded without prepared adrctl' >&2
            exit 1
          fi
          grep -F 'Missing documentation dependency vendor/adrctl.bash' "${stderr}"
          test ! -e vendor/bashdeps.bash
          test ! -e doc/adr/README.md
          rm -rf vendor

      - name: Validate maintained source
        run: make check

      - name: Synchronize and verify repository dependencies
        run: |
          make deps
          make deps-check
          test -f vendor/bash-minifier.bash
          test -f vendor/doxygen-bash.awk
          test -f vendor/adrctl.bash

      - name: Verify make all from fresh generated state
        run: |
          rm -rf dist test-results doc/reference doc/adr/README.md
          make all
          make deps-check

      - name: Verify build artifacts and checksums
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -name '*.bash' -perm -u+x -print | sort)
          test "${#artifacts[@]}" -eq 3
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}.sha256"
            test ! -e "${artifact}.256"
            (cd dist && sha256sum -c "$(basename "${artifact}").sha256")
          done
          dev_artifact="$(find dist -maxdepth 1 -type f -name '*.dev.bash' -print -quit)"
          ordinary_artifact="$(find dist -maxdepth 1 -type f -name '*.bash' ! -name '*.dev.bash' ! -name '*.min.bash' -print -quit)"
          min_artifact="$(find dist -maxdepth 1 -type f -name '*.min.bash' -print -quit)"
          test -n "${dev_artifact}" && test -n "${ordinary_artifact}" && test -n "${min_artifact}"
          grep -F '# Generated by make build. Do not edit directly.' "${dev_artifact}"
          if grep -F '# Generated by make build. Do not edit directly.' "${ordinary_artifact}"; then
            printf '%s\n' 'ordinary artifact retained a full-line generated comment' >&2
            exit 1
          fi
          if cmp -s "${ordinary_artifact}" "${min_artifact}"; then
            printf '%s\n' 'minified artifact is byte-identical to ordinary artifact' >&2
            exit 1
          fi

      - name: Verify deterministic build output
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.bash "${RUNNER_TEMP}/first-build/"
          for artifact in dist/*.bash; do
            : >"${artifact}.256"
          done
          make build
          for artifact in dist/*.bash; do
            cmp "${RUNNER_TEMP}/first-build/$(basename "${artifact}")" "${artifact}"
            test -f "${artifact}.sha256"
            test ! -e "${artifact}.256"
          done

      - name: Generate documentation from prepared dependencies
        run: |
          make docs
          make deps-check
          test -f doc/adr/README.md
          grep -Fq 'ADR-017: Generate ADR Navigation Ephemerally' doc/adr/README.md
          git check-ignore -q doc/adr/README.md
          test -f doc/reference/index.html
          git check-ignore -q doc/reference/index.html
          test -z "$(git status --short)"

      # Fast public-command fixture smoke gate: useful TAP failure detail
      # appears before the full three-flavor JUnit matrix runs.
      - name: Verify filename contract with TAP diagnostics
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap tests/filename-verification.bats

      # Fast opt-in S3 boundary tests; retain detailed TAP assertions when
      # a conditional PUT or managed-metadata fixture fails.
      - name: Verify dated backup publication with TAP diagnostics
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap \
              --filter 'dated backup|backup enabled|same UTC day|unrecognized same-day|failed authoritative PUT|lost response from dated' \
              tests/public-lifecycle.bats

      # Public recoverability/failure tests surface TAP assertion lines before
      # the longer all-artifact JUnit matrix and do not contact real AWS/ACME.
      - name: Verify read-only dated recovery and fault boundaries
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap \
              --filter 'dated recovery object|fresh runner reads current|UTC date change|backup post-PUT HEAD|backup HEAD denial|foreign backup scope|unsupported ZIP|tampered downloaded|encrypted dated copy|wrong key cannot' \
              tests/public-lifecycle.bats

      # Run destructive-contract mocks immediately after artifact generation
      # so any failed no-delete or conditional-put assertion is visible in TAP.
      - name: Verify guarded retention before full artifact matrix
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap tests/retention.bats

      - name: Run Bats tests for every artifact flavor
        id: bats
        continue-on-error: true
        run: make test-report

      - name: Publish Bats test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Bats tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

      - name: Verify consumer artifacts are independent of vendor state
        if: steps.bats.outcome == 'success'
        run: |
          rm -rf vendor
          for artifact in dist/*.bash; do
            "${artifact}" --help >/dev/null
            "${artifact}" --version >/dev/null
            if "${artifact}" --s3-bucket fixture-bucket example.com >/dev/null 2>&1; then
              printf '%s\n' 'Incomplete MVP lifecycle unexpectedly succeeded' >&2
              exit 1
            fi
          done

      - name: Fail if Bats failed
        if: steps.bats.outcome == 'failure'
        run: exit 1

  bash43:
    name: Bash 4.3 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependency bootstrap requirements
        run: sudo apt-get update && sudo apt-get install --yes curl make

      - name: Prepare dependencies and build
        run: make all

      - name: Validate every artifact under Bash 4.3
        run: |
          for artifact in dist/*.bash; do
            docker run --rm \
              --env BASH_STARTER_ARTIFACT="/work/${artifact}" \
              --volume "${GITHUB_WORKSPACE}:/work:ro" \
              --workdir /work \
              bash:4.3 \
              bash tests/compat-bash43.bash
          done

  # ADR-031 requires real AES-256/OCB crypto evidence. The ordinary 24.04
  # Bats matrix remains supported, but its GnuPG 2.4.4 cannot run these
  # cases; the approved minimum is 2.4.7. 26.04 ships GnuPG 2.4.8.
  encryption:
    name: Authenticated archive interoperability
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install distribution crypto and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl gnupg make openssl

      - name: Build verified portable artifacts
        run: |
          make all
          make deps-check
          (cd dist && for sum in *.bash.sha256; do sha256sum -c "$sum"; done)

      - name: Require non-skipped authenticated encryption evidence for all variants
        run: |
          set -euo pipefail
          gpg --version | head -n 1
          for artifact in dist/certbotbot.dev.bash dist/certbotbot.bash dist/certbotbot.min.bash; do
            report="${RUNNER_TEMP}/$(basename "$artifact").tap"
            if ! BASH_STARTER_ARTIFACT="${PWD}/${artifact}" bats \
              --formatter tap \
              --filter 'encryption|encrypted|ciphertext|migrat|decryption|GnuPG' \
              tests/public-lifecycle.bats >"$report"; then
              cat "$report"
              printf '%s\n' 'Authenticated encryption acceptance tests failed' >&2
              exit 1
            fi
            cat "$report"
            if grep -Eq '^ok [0-9]+ .*# skip' "$report"; then
              printf '%s\n' 'Authenticated encryption tests cannot be skipped' >&2
              exit 1
            fi
            count="$(grep -Ec '^ok [0-9]+ ' "$report" || :)"
            if (( count < 20 )); then
              printf '%s\n' 'Authenticated encryption test inventory incomplete' >&2
              exit 1
            fi
          done
