---
name: Test

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare and verify producer artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      manifest_sha: ${{ steps.handoff.outputs.manifest_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl doxygen graphviz make shellcheck shfmt

      - name: Verify build does not acquire missing dependencies
        run: |
          test ! -e vendor
          stderr="${RUNNER_TEMP}/build.stderr"
          if make build >/dev/null 2>"${stderr}"; then
            printf '%s\n' 'make build unexpectedly succeeded without prepared dependencies' >&2
            exit 1
          fi
          grep -F 'Missing prepared mktext library; run make deps' "${stderr}"
          test ! -e vendor

      - name: Verify documentation does not acquire missing adrctl
        run: |
          mkdir -p vendor
          printf '%s\n' '# prepared documentation filter' >vendor/doxygen-bash.awk
          stderr="${RUNNER_TEMP}/docs.stderr"
          if make docs >/dev/null 2>"${stderr}"; then
            printf '%s\n' 'make docs unexpectedly succeeded without prepared adrctl' >&2
            exit 1
          fi
          grep -F 'Missing documentation dependency vendor/adrctl.bash' "${stderr}"
          test ! -e vendor/bashdeps.bash
          test ! -e doc/adr/README.md
          rm -rf vendor

      - name: Validate maintained source
        run: make check

      - name: Synchronize and verify repository dependencies
        run: |
          make deps
          make deps-check
          test -f vendor/bash-minifier.bash
          test -f vendor/doxygen-bash.awk
          test -f vendor/adrctl.bash

      - name: Verify make all from fresh generated state
        run: |
          rm -rf dist test-results doc/reference doc/adr/README.md
          make all
          make deps-check

      - name: Verify build artifacts and checksums
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -name '*.bash' -perm -u+x -print | sort)
          test "${#artifacts[@]}" -eq 4
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}.sha256"
            test ! -e "${artifact}.256"
            (cd dist && sha256sum -c "$(basename "${artifact}").sha256")
          done
          dev_artifact="$(find dist -maxdepth 1 -type f -name '*.dev.bash' -print -quit)"
          ordinary_artifact=dist/certbotbot.bash
          min_artifact="$(find dist -maxdepth 1 -type f -name '*.min.bash' -print -quit)"
          test -n "${dev_artifact}" && test -n "${ordinary_artifact}" && test -n "${min_artifact}"
          grep -F '# Generated by make build. Do not edit directly.' "${dev_artifact}"
          if grep -F '# Generated by make build. Do not edit directly.' "${ordinary_artifact}"; then
            printf '%s\n' 'ordinary artifact retained a full-line generated comment' >&2
            exit 1
          fi
          if cmp -s "${ordinary_artifact}" "${min_artifact}"; then
            printf '%s\n' 'minified artifact is byte-identical to ordinary artifact' >&2
            exit 1
          fi

      - name: Verify deterministic build output
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.bash "${RUNNER_TEMP}/first-build/"
          for artifact in dist/*.bash; do
            : >"${artifact}.256"
          done
          make build
          for artifact in dist/*.bash; do
            cmp "${RUNNER_TEMP}/first-build/$(basename "${artifact}")" "${artifact}"
            test -f "${artifact}.sha256"
            test ! -e "${artifact}.256"
          done

      - name: Generate documentation from prepared dependencies
        run: |
          make docs
          make deps-check
          test -f doc/adr/README.md
          grep -Fq 'ADR-017: Generate ADR Navigation Ephemerally' doc/adr/README.md
          git check-ignore -q doc/adr/README.md
          test -f doc/reference/index.html
          git check-ignore -q doc/reference/index.html
          test -z "$(git status --short)"

      # Fast public-command fixture smoke gate: useful TAP failure detail
      # appears before the full three-flavor JUnit matrix runs.
      - name: Verify filename contract with TAP diagnostics
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap tests/filename-verification.bats

      # Fast opt-in S3 boundary tests; retain detailed TAP assertions when
      # a conditional PUT or managed-metadata fixture fails.
      - name: Verify dated backup publication with TAP diagnostics
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap \
              --filter 'dated backup|backup enabled|same UTC day|unrecognized same-day|failed authoritative PUT|lost response from dated' \
              tests/public-lifecycle.bats

      # Public recoverability/failure tests surface TAP assertion lines before
      # the longer all-artifact JUnit matrix and do not contact real AWS/ACME.
      - name: Verify read-only dated recovery and fault boundaries
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap \
              --filter 'dated recovery object|fresh runner reads current|UTC date change|backup post-PUT HEAD|backup HEAD denial|foreign backup scope|unsupported ZIP|tampered downloaded|encrypted dated copy|wrong key cannot' \
              tests/public-lifecycle.bats

      # Run destructive-contract mocks immediately after artifact generation
      # so any failed no-delete or conditional-put assertion is visible in TAP.
      - name: Verify guarded retention before full artifact matrix
        run: |
          BASH_STARTER_ARTIFACT="${PWD}/dist/certbotbot.dev.bash" \
            bats --formatter tap tests/retention.bats tests/retention-safety.bats

      # Preserve the old no-vendor acceptance before exporting the built bytes.
      - name: Verify producer artifacts are independent of vendor state
        run: |
          rm -rf vendor
          for artifact in dist/*.bash; do
            "${artifact}" --help >/dev/null
            "${artifact}" --version >/dev/null
            if "${artifact}" --s3-bucket fixture-bucket example.com >/dev/null 2>&1; then
              printf '%s\n' 'Incomplete MVP lifecycle unexpectedly succeeded' >&2
              exit 1
            fi
          done

      # Downloaded release-client bytes must function without src/, lib/,
      # vendor/, Certbot, or the producer executable at runtime. The test
      # driver stays in checkout but invokes only an isolated shipped copy.
      - name: Verify shipped standalone client without build sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shipped-client"
          cp dist/certbotbot-client.bash dist/certbotbot-client.bash.sha256 \
            "$RUNNER_TEMP/shipped-client/"
          (
            cd "$RUNNER_TEMP/shipped-client"
            sha256sum -c certbotbot-client.bash.sha256
            bash -n certbotbot-client.bash
            ./certbotbot-client.bash --help >/dev/null
            ./certbotbot-client.bash --version >/dev/null
          )
          BASH_STARTER_CLIENT_ARTIFACT="$RUNNER_TEMP/shipped-client/certbotbot-client.bash" \
            bats --formatter tap tests/client-read.bats tests/client-extract.bats

      - name: Prepare verified same-run producer handoff
        id: handoff
        run: |
          set -euo pipefail
          digest="$(bash ci/producer-handoff.bash create dist \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" 0.0.0-dev)"
          printf 'manifest_sha=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      # The handoff is the verified release-file subset, not the whole checkout
      # or vendor tree. The one-day lifetime also limits Actions storage usage.
      - name: Upload verified producer handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  bats:
    name: Bats (${{ matrix.flavor }})
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [development, ordinary, minified]
    steps:
      - name: Check out the same workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats make

      - name: Download verified producer handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

      # GitHub artifact downloads normalize Unix executable permissions.
      # Refuse symlinks before restoring the intended executable file modes.
      - name: Restore artifact permissions and verify exact handoff
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          for artifact in dist/certbotbot.dev.bash dist/certbotbot.bash dist/certbotbot.min.bash dist/certbotbot-client.bash; do
            test -f "$artifact" && test ! -L "$artifact"
            chmod 0755 "$artifact"
          done
          bash ci/producer-handoff.bash verify dist \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            0.0.0-dev "$EXPECTED_MANIFEST_SHA"

      - name: Run complete Bats contract for selected producer flavor
        env:
          TEST_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          make test-report-one "TEST_FLAVOR=$TEST_FLAVOR"
          test -s "test-results/bats-$TEST_FLAVOR.xml"

      # Supplemental per-flavor annotations, never a replacement for Bats
      # status; failures/absent reports must leave the matrix leg red.
      - name: Publish selected Bats JUnit report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Bats JUnit (${{ matrix.flavor }})
          path: test-results/bats-${{ matrix.flavor }}.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

  # Retain the original required-check name, but now gate the preparation,
  # full three-flavor Bats matrix, and both existing compatibility jobs.
  test:
    name: Check, build, and test
    needs: [prepare, bats, bash43, encryption]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every producer quality gate to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BATS_RESULT: ${{ needs.bats.result }}
          BASH43_RESULT: ${{ needs.bash43.result }}
          ENCRYPTION_RESULT: ${{ needs.encryption.result }}
        run: |
          set -euo pipefail
          for gate in PREPARE_RESULT BATS_RESULT BASH43_RESULT ENCRYPTION_RESULT; do
            if [[ "${!gate}" != success ]]; then
              printf 'Required quality gate %s did not succeed (%s)\n' "$gate" "${!gate}" >&2
              exit 1
            fi
          done

  # Keep each independent Bash 4.3 result inspectable. The stable historical
  # "Bash 4.3 compatibility" check is a strict aggregate below.
  bash43-flavor:
    name: Bash 4.3 (${{ matrix.flavor }})
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [development, ordinary, minified]
    steps:
      - name: Check out the same workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified producer handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

      - name: Restore permissions and verify exact producer bytes
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          for artifact in dist/certbotbot.dev.bash dist/certbotbot.bash dist/certbotbot.min.bash dist/certbotbot-client.bash; do
            test -f "$artifact" && test ! -L "$artifact"
            chmod 0755 "$artifact"
          done
          bash ci/producer-handoff.bash verify dist \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            0.0.0-dev "$EXPECTED_MANIFEST_SHA"

      - name: Verify selected producer artifact using Bash 4.3
        env:
          TEST_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          case "$TEST_FLAVOR" in
            development) artifact=dist/certbotbot.dev.bash ;;
            ordinary) artifact=dist/certbotbot.bash ;;
            minified) artifact=dist/certbotbot.min.bash ;;
            *) printf '%s\n' 'Invalid producer flavor' >&2; exit 64 ;;
          esac
          docker run --rm \
            --env BASH_STARTER_ARTIFACT="/work/$artifact" \
            --env BASH_STARTER_CLIENT_ARTIFACT="/work/dist/certbotbot-client.bash" \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            bash:4.3 \
            bash tests/compat-bash43.bash

  # Preserve the preexisting required check name. This job succeeds only when
  # preparation and every Bash 4.3 matrix leg have independently succeeded.
  bash43:
    name: Bash 4.3 compatibility
    needs: [prepare, bash43-flavor]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require all Bash 4.3 flavor checks
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          FLAVORS_RESULT: ${{ needs['bash43-flavor'].result }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_RESULT" == success && "$FLAVORS_RESULT" == success ]] || {
            printf '%s\n' 'Required Bash 4.3 preparation or flavor matrix did not succeed' >&2
            exit 1
          }

  # ADR-031 requires real AES-256/OCB crypto evidence on supported GnuPG.
  # Ubuntu 26.04 provides GnuPG >= 2.4.7. Each flavor retains the original
  # filtered TAP inventory and rejects skips or absent positive coverage.
  encryption-flavor:
    name: Authenticated encryption (${{ matrix.flavor }})
    needs: prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [development, ordinary, minified]
    steps:
      - name: Check out the same workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install distribution crypto and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl gnupg make openssl

      - name: Download verified producer handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

      - name: Restore permissions and verify exact producer bytes
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          for artifact in dist/certbotbot.dev.bash dist/certbotbot.bash dist/certbotbot.min.bash dist/certbotbot-client.bash; do
            test -f "$artifact" && test ! -L "$artifact"
            chmod 0755 "$artifact"
          done
          bash ci/producer-handoff.bash verify dist \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            0.0.0-dev "$EXPECTED_MANIFEST_SHA"

      - name: Require non-skipped authenticated encryption for selected flavor
        env:
          TEST_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          gpg --version | head -n 1
          gpg_version="$(gpg --version | awk 'NR == 1 {print $3}')"
          dpkg --compare-versions "$gpg_version" ge 2.4.7 || {
            printf '%s\n' 'Authenticated encryption requires GnuPG >= 2.4.7' >&2
            exit 1
          }
          case "$TEST_FLAVOR" in
            development) artifact=dist/certbotbot.dev.bash ;;
            ordinary) artifact=dist/certbotbot.bash ;;
            minified) artifact=dist/certbotbot.min.bash ;;
            *) printf '%s\n' 'Invalid producer flavor' >&2; exit 64 ;;
          esac
          report="$RUNNER_TEMP/$(basename "$artifact").tap"
          if ! BASH_STARTER_ARTIFACT="$PWD/$artifact" bats \
            --formatter tap \
            --filter 'encryption|encrypted|ciphertext|migrat|decryption|GnuPG' \
            tests/public-lifecycle.bats >"$report"; then
            cat "$report"
            printf '%s\n' 'Authenticated encryption acceptance tests failed' >&2
            exit 1
          fi
          cat "$report"
          if grep -Eq '^ok [0-9]+ .*# skip' "$report"; then
            printf '%s\n' 'Authenticated encryption tests cannot be skipped' >&2
            exit 1
          fi
          count="$(grep -Ec '^ok [0-9]+ ' "$report" || :)"
          if (( count < 20 )); then
            printf '%s\n' 'Authenticated encryption test inventory incomplete' >&2
            exit 1
          fi

  # Preserve the historical encryption required-check name, while requiring
  # the entire concurrent flavor matrix to succeed, not any one passing leg.
  encryption:
    name: Authenticated archive interoperability
    needs: [prepare, encryption-flavor]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require all authenticated encryption flavor checks
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          FLAVORS_RESULT: ${{ needs['encryption-flavor'].result }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_RESULT" == success && "$FLAVORS_RESULT" == success ]] || {
            printf '%s\n' 'Required authenticated encryption preparation or flavor matrix did not succeed' >&2
            exit 1
          }
